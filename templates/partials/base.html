{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff4d2d">
  <title>{% block title %}{{ SITE_NAME }} — {{ SITE_TAGLINE }}{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}FOODIES delivers great food from the best local kitchens to your door. Good Food. Great Mood.{% endblock %}">
  <link rel="icon" href="{% static 'images/favicon.svg' %}" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="{% static 'css/foodies.css' %}" rel="stylesheet">
  {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}

  <div class="fd-toast-stack">
    {% for message in messages %}
      <div class="fd-toast {{ message.tags }}" data-autohide="4600">
        <i class="bi {% if message.tags == 'success' %}bi-check-circle-fill{% elif message.tags == 'error' %}bi-exclamation-octagon-fill{% elif message.tags == 'warning' %}bi-exclamation-triangle-fill{% else %}bi-info-circle-fill{% endif %}"></i>
        <div class="flex-grow-1 small fw-semibold">{{ message }}</div>
        <button class="btn-close" aria-label="Close" onclick="this.parentElement.remove()"></button>
      </div>
    {% endfor %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    window.FOODIES = {
      csrfToken: "{{ csrf_token }}",
      currency: "{{ CURRENCY }}",
      loginUrl: "{% url 'accounts:login' %}",
      cartUrl: "{% url 'cart:detail' %}",
      user: {% if user.is_authenticated %}"{{ user.email|escapejs }}"{% else %}null{% endif %}
    };
  </script>
  <script src="{% static 'js/foodies.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
