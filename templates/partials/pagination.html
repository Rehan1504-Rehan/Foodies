{% if page_obj.paginator.num_pages > 1 %}
<nav class="mt-4" aria-label="Pagination">
  <ul class="pagination justify-content-center gap-1">
    <li class="page-item {% if not page_obj.has_previous %}disabled{% endif %}">
      <a class="page-link rounded-pill border-0" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.previous_page_number|default:1 }}"><i class="bi bi-chevron-left"></i></a>
    </li>
    {% for num in page_obj.paginator.page_range %}
      {% if num == page_obj.number %}
        <li class="page-item active"><span class="page-link rounded-pill border-0 bg-brand">{{ num }}</span></li>
      {% elif num > page_obj.number|add:-3 and num < page_obj.number|add:3 %}
        <li class="page-item"><a class="page-link rounded-pill border-0" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ num }}">{{ num }}</a></li>
      {% endif %}
    {% endfor %}
    <li class="page-item {% if not page_obj.has_next %}disabled{% endif %}">
      <a class="page-link rounded-pill border-0" href="?{% if querystring %}{{ querystring }}&{% endif %}page={{ page_obj.next_page_number|default:page_obj.paginator.num_pages }}"><i class="bi bi-chevron-right"></i></a>
    </li>
  </ul>
</nav>
{% endif %}
